name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: furniture
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_mysql }
      # Laravel 11 đã hết hạn bảo trì bảo mật → composer chặn cài vì security advisories.
      # Tắt advisory blocking ngay trong CI (không phụ thuộc config global máy ai).
      - name: Cho phép cài laravel/framework 11.x (tắt advisory blocking)
        run: composer config policy.advisories.block false
      - run: composer install -q --no-ansi
      - name: Tạo .env và trỏ DB về service mysql của CI
        run: |
          cp .env.example .env
          php artisan key:generate
          # Đè biến DB để khớp service mysql (root/root @ 127.0.0.1)
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
      - run: php artisan migrate --force
      - run: php artisan test
      - run: ./vendor/bin/pint --test
